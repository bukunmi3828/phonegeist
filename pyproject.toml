[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "phonegeist"
version = "1.0.0"
description = "Type text from a phone into the active field on a Windows PC"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "Phonegeist contributors" }]
dependencies = [
    "Flask>=3.0,<4",
    "pynput>=1.7,<2",
    "qrcode>=8,<9",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
phonegeist = "phonegeist:main"

[tool.setuptools]
py-modules = ["phonegeist"]
